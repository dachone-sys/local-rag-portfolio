<!doctype html><html lang="ja"><meta charset="utf-8"><title>回答に使う資料を選ぶ</title>
<style>body{font:16px/1.7 Meiryo,sans-serif;background:#f4f6f4;color:#183b32;margin:30px auto;max-width:1100px;padding:20px}h1{font-size:28px}article{background:white;padding:15px;margin:12px 0;border-radius:8px}small{overflow-wrap:anywhere;color:#52665c}button{background:#17694f;color:white;border:0;padding:12px 25px;cursor:pointer}label{margin-right:20px}a{color:#17694f}.toolbar{position:sticky;bottom:0;padding:15px;background:#e2eee5}input[type=search]{width:90%;padding:10px;font:inherit}</style>
<h1>回答に使う資料を選ぶ</h1><p>PDFを開いて現行版と閲覧範囲を確認し、回答に使う資料を選んでください。確認できない資料は「未確認」のままにします。旧版に指定すると old フォルダへ移し、回答から除外します。</p><p>まずは係でよく使う手順書を数件選ぶと試しやすくなります。本文を外部AIへ送る操作はありません。</p><input id="filter" type="search" placeholder="資料名・保存場所で絞り込む"><p id="count"></p><div id="list"></div>
<div class="toolbar"><label><input id="confirmed" type="checkbox">選んだ資料をこのPCの検証に使用します。適用条件・版は原本で確認します</label><p><button id="save">選んだ資料を回答用に取り込む</button> <a href="/">質問画面へ戻る</a></p><p id="status" aria-live="polite"></p></div>
<script>
let rows=[];const list=document.getElementById('list'),status=document.getElementById('status'),button=document.getElementById('save');function node(tag,text){let n=document.createElement(tag);n.textContent=text;return n}
function draw(){list.replaceChildren();let term=document.getElementById('filter').value.toLowerCase();for(let d of rows){if(!(d.title+' '+d.file).toLowerCase().includes(term))continue;let item=node('article','');item.append(node('strong',d.title),node('br',''),node('small',d.file),node('br',''),node('small',d.readability+'／版：'+d.revision));let p=node('p',''),a=node('a','PDFを開いて確認する');a.href='/source-pdf?id='+d.id;a.target='_blank';a.rel='noopener';p.append(a);item.append(p);for(let [v,label] of [['review_required','未確認'],['current','回答に使う'],['old','旧版（oldへ移動）']]){let l=node('label',label),r=document.createElement('input');r.type='radio';r.name=d.id;r.value=v;r.checked=d.choice===v;r.disabled=d.status==='old'&&v!=='old';r.onchange=()=>{d.choice=v};l.prepend(r);item.append(l)}list.append(item)}document.getElementById('count').textContent=rows.length+'件の保存済み資料／現在の検索対象 '+rows.filter(d=>d.indexed).length+'件';}
fetch('/source-list').then(r=>r.json()).then(data=>{rows=data.map(d=>({...d,choice:d.status==='current'?'current':d.status==='old'?'old':'review_required'}));draw()});document.getElementById('filter').oninput=draw;
button.onclick=async()=>{if(!document.getElementById('confirmed').checked){status.textContent='このPCで使用する確認欄にチェックしてください。';return;}let selected=rows.filter(d=>d.choice==='current').map(d=>d.id);if(!selected.length){status.textContent='回答に使う資料を1件以上選んでください。';return;}button.disabled=true;status.textContent='PC内で資料を取り込んでいます。件数・ページ数によって数分かかる場合があります。';let res=await fetch('/configure',{method:'POST',headers:{'Content-Type':'application/json','X-PoC-Token':'__TOKEN__'},body:JSON.stringify({selected,old:rows.filter(d=>d.choice==='old').map(d=>d.id),confirmed:true})});if(!res.ok){status.textContent='選択を保存できませんでした。';button.disabled=false;return;}let timer=setInterval(async()=>{let j=await(await fetch('/job')).json();if(j.state==='done'){clearInterval(timer);status.textContent=j.documents+'件のPDFを取り込みました。質問画面で試せます。';button.disabled=false;}else if(j.state==='failed'){clearInterval(timer);status.textContent=j.message;button.disabled=false;}},2000);};
</script></html>
